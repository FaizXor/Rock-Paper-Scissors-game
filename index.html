<!DOCTYPE html>
<html>

   <head>

      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <link rel="stylesheet" href="style.css">
      <title></title>
   </head>

   <body>
    <script src="script.js" defer></script>
      <div id="mainContainer">

         <div id="RoundNum">
            <p class="Round">Round</p>
            <p class="Num">NUM</p>
         </div>

         <div id="ComputerSpace">
            <div id="ComputerPlayer">
             <img src="assets/ComputerPlayerFace_happy.png" alt="Computer Happy Face">
            </div>

             <div id="ComputerCardMove">
              <img src="assets/computerPlayer_card.png" alt="Computer Card Moves">  
             </div>  

            <img id="ComputerTable" src="assets/computerPlayer_tabel.png" alt="Computer Table">

         </div>

         <div id="PlayerSpace">
            <div id="PlayerButtons">
             <button id="RockButton" type="button">
              <img id="RockButton" src="assets/humanPlayer_buttonNormalRock.png" onmouseover="this.src ='assets/humanPlayer_buttonHoveredRock.png'" onmousedown="this.src = 'assets/humanPlayer_buttonPressedRock.png'" onmouseup="this.src ='assets/humanPlayer_buttonHoveredRock.png'" onmouseout="this.src = 'assets/humanPlayer_buttonNormalRock.png'" alt="Rock Button">
             </button> 
             <button id="PaperButton" type="button">
               <img id="PaperButton" src="assets/humanPlayer_buttonNormalPaper.png" onmouseover="this.src ='assets/humanPlayer_buttonHoveredPaper.png'" onmousedown="this.src = 'assets/humanPlayer_buttonPressedPaper.png'" onmouseup="this.src ='assets/humanPlayer_buttonHoveredPaper.png'" onmouseout="this.src = 'assets/humanPlayer_buttonNormalPaper.png'" alt="Paper Button">
             </button> 
             <button id="ScissorsButton" type="button">
               <img id="ScissorsButton" src="assets/humanPlayer_buttonNormalScissors.png" onmouseover="this.src ='assets/humanPlayer_buttonHoveredScissors.png'" onmousedown="this.src = 'assets/humanPlayer_buttonPressedScissors.png'" onmouseup="this.src ='assets/humanPlayer_buttonHoveredScissors.png'" onmouseout="this.src = 'assets/humanPlayer_buttonNormalScissors.png'" alt="Scissor Button">
             </button> 
            </div>

            <img id="PlayerTable" src="assets/mainplayer_Tabel.png" alt="Players Table">

         </div>

      </div>
      
    
   </body>

</html>
